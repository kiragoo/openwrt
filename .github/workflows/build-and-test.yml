name: Build and Test OpenWrt K3s

on:
  push:
    branches:
      - main
      - dev

env:
  OPENWRT_VERSION: 24.10.0
  TARGET_ARCH: x86
  TARGET_SUBARCH: 64
  CONFIG_FILE: config-k3s

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Free up disk space
        run: |
          echo "清理磁盘空间..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h
          echo "可用空间："
          df -h / | tail -1 | awk '{print $4}'

      - name: Install dependencies
        run: |
          echo "安装构建依赖..."
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file wget \
            qemu-system-x86 qemu-utils ovmf expect libelf-dev libncurses-dev \
            autoconf automake libtool openssl ccache ecj fastjar java-propose-classpath \
            libncursesw5-dev xsltproc
          
          echo "验证关键工具..."
          python3 --version
          gcc --version | head -1
          make --version | head -1
          df -h

      - name: Download OpenWrt source
        run: |
          echo "下载 OpenWrt 源码..."
          make download
          df -h

      - name: Update and install feeds
        run: |
          echo "更新和安装 feeds..."
          make feeds
          df -h

      - name: Apply configuration
        run: |
          echo "应用配置文件..."
          if [ ! -f config-k3s ]; then
            echo "错误: config-k3s 文件不存在"
            exit 1
          fi
          
          cp config-k3s openwrt/.config
          echo "配置文件已复制"
          
          cd openwrt
          echo "运行 defconfig..."
          make defconfig V=s || {
            echo "defconfig 失败，尝试单线程模式..."
            make -j1 defconfig V=sc
          }

      - name: Download packages
        run: |
          echo "下载软件包..."
          cd openwrt && make download -j$(nproc) V=s

      - name: Build OpenWrt
        run: |
          echo "开始编译 OpenWrt..."
          cd openwrt && make -j$(nproc) V=s
          df -h

      - name: Check build artifacts
        run: |
          echo "检查编译产物..."
          ls -lh openwrt/bin/targets/${{ env.TARGET_ARCH }}/${{ env.TARGET_SUBARCH }}/
          IMAGE_FILE=$(find openwrt/bin/targets/${{ env.TARGET_ARCH }}/${{ env.TARGET_SUBARCH }}/ -name "*combined-ext4.img.gz" | head -n 1)
          if [ -z "$IMAGE_FILE" ]; then
            echo "错误: 未找到镜像文件"
            exit 1
          fi
          echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV
          echo "找到镜像: $IMAGE_FILE"

      - name: Prepare VM image
        run: |
          echo "准备虚拟机镜像..."
          gunzip -c ${{ env.IMAGE_FILE }} > openwrt.img
          
          # 扩展镜像以便有足够空间安装 K3s
          qemu-img resize openwrt.img 8G
          
          # 转换为 qcow2 格式以提高性能
          qemu-img convert -f raw -O qcow2 openwrt.img openwrt.qcow2
          
          ls -lh openwrt.qcow2

      - name: Start OpenWrt VM
        run: |
          echo "启动 OpenWrt 虚拟机..."
          
          # 启动 QEMU 虚拟机
          sudo qemu-system-x86_64 \
            -name openwrt-test \
            -machine q35 \
            -cpu host \
            -enable-kvm \
            -smp 2 \
            -m 2048 \
            -drive file=openwrt.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::8080-:80 \
            -device virtio-net-pci,netdev=net0 \
            -nographic \
            -daemonize
          
          echo "虚拟机已在后台启动"

      - name: Configure OpenWrt
        run: |
          chmod +x .github/scripts/*.sh
          .github/scripts/configure-openwrt.sh

      - name: Verify kernel features
        run: |
          .github/scripts/verify-kernel.sh | tee verify-kernel.log

      - name: Install K3s
        run: |
          .github/scripts/install-k3s.sh | tee install-k3s.log

      - name: Verify K3s cluster
        run: |
          .github/scripts/verify-k3s.sh | tee verify-k3s.log

      - name: Test K3s deployment
        run: |
          .github/scripts/test-deployment.sh | tee test-deployment.log

      - name: Collect logs
        if: always()
        run: |
          echo "收集日志..."
          
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 root@localhost"
          
          # 创建日志汇总
          echo "=== OpenWrt 系统日志 ===" > all-logs.txt
          $SSH_CMD "logread" >> all-logs.txt 2>&1 || echo "无法获取系统日志" >> all-logs.txt
          
          echo "" >> all-logs.txt
          echo "=== dmesg 日志 ===" >> all-logs.txt
          $SSH_CMD "dmesg | tail -100" >> all-logs.txt 2>&1 || echo "无法获取 dmesg" >> all-logs.txt
          
          # 合并测试日志
          for log in verify-kernel.log install-k3s.log verify-k3s.log test-deployment.log; do
            if [ -f "$log" ]; then
              echo "" >> all-logs.txt
              echo "=== $log ===" >> all-logs.txt
              cat "$log" >> all-logs.txt
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            all-logs.txt
            verify-kernel.log
            install-k3s.log
            verify-k3s.log
            test-deployment.log
          retention-days: 7

      - name: Cleanup VM
        if: always()
        run: |
          echo "清理虚拟机..."
          sudo pkill -f qemu-system-x86_64 || true
          rm -f openwrt.img openwrt.qcow2
          echo "清理完成"

      - name: Summary
        if: always()
        run: |
          echo "## 构建和测试总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **状态**: 成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ OpenWrt 镜像构建成功" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 内核特性验证通过" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ K3s 安装成功" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ K3s 集群验证通过" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 部署测试成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **状态**: 失败" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请查看日志了解详细信息" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 配置信息" >> $GITHUB_STEP_SUMMARY
          echo "- OpenWrt 版本: ${{ env.OPENWRT_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- 目标架构: ${{ env.TARGET_ARCH }}/${{ env.TARGET_SUBARCH }}" >> $GITHUB_STEP_SUMMARY
          echo "- 配置文件: ${{ env.CONFIG_FILE }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload OpenWrt image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-k3s-x86-64
          path: ${{ env.IMAGE_FILE }}
          retention-days: 30
